<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161b">
<title>Drama Soundboard</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Drama Soundboard</h1>
    <p class="tag">Audio Controller for Class Drama</p>
  </div>
  <p id="app-status" class="app-status" role="status">Memuat…</p>
</header>

<div class="bar">
  <button id="stop-all" class="stopall" type="button">■ Stop All</button>
  <input id="search" type="search" placeholder="Cari audio atau scene" aria-label="Cari audio atau scene" autocomplete="off">
  <label class="master">Volume master
    <input id="master" type="range" min="0" max="1" step="0.05" value="1">
    <output id="master-out">100%</output>
  </label>
  <label class="mode"><input id="exclusive" type="checkbox" checked> Mode eksklusif</label>
</div>

<main>
  <div id="notice" class="notice" hidden></div>
  <section aria-labelledby="now-h">
    <h2 id="now-h">Sedang aktif</h2>
    <div id="now"></div>
  </section>
  <nav id="tabs" class="tabs" aria-label="Pilih scene"></nav>
  <section id="panel" aria-live="polite"></section>
</main>
<div id="toast" class="toast" role="alert" hidden></div>
<script src="assets/js/app.js" defer></script>
</body>
</html>
